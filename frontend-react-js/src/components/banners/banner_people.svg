<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 92" width="600" height="92" preserveAspectRatio="xMaxYMid slice">
  <defs>
    <radialGradient id="glow" cx="75%" cy="50%" r="55%">
      <stop offset="0" stop-color="#9500FF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#9500FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0.35" stop-color="#9500FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#9500FF" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="92" fill="#000"/>
  <rect width="600" height="92" fill="url(#glow)"/>
  <rect y="91" width="600" height="1" fill="url(#rule)"/>

  <g fill="none" stroke="#9500FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <!-- Person 1 and Person 2 chatting: shared speech bubble -->
    <g transform="translate(330,50)" opacity="0.55">
      <circle cy="-12" r="7"/>
      <path d="M-14 18 A14 14 0 0 1 14 18"/>
    </g>
    <g transform="translate(382,50)" opacity="0.8">
      <circle cy="-12" r="7"/>
      <path d="M-14 18 A14 14 0 0 1 14 18"/>
    </g>
    <g opacity="0.7">
      <path d="M349 30 H364 A7 7 0 0 0 364 14 H349 A7 7 0 0 0 349 30 M352 30 L346 36 L355 30"/>
      <g fill="#9500FF" stroke="none">
        <circle cx="350" cy="22" r="1.6"/>
        <circle cx="356.5" cy="22" r="1.6"/>
        <circle cx="363" cy="22" r="1.6"/>
      </g>
    </g>

    <!-- Person 2 and Person 3 connected -->
    <path d="M393 34 Q420 18 447 34" stroke-dasharray="2 5" opacity="0.6"/>

    <!-- Person 3 waving toward Person 4 -->
    <g transform="translate(458,50)" opacity="0.9">
      <circle cy="-12" r="7"/>
      <path d="M-14 18 A14 14 0 0 1 14 18"/>
      <path d="M10 8 L20 -4"/>
      <path d="M24 -10 L27 -13 M26 -4 L30 -5" opacity="0.6"/>
    </g>

    <!-- Person 4 replying with a heart -->
    <g transform="translate(530,50)" opacity="0.65">
      <circle cy="-12" r="7"/>
      <path d="M-14 18 A14 14 0 0 1 14 18"/>
    </g>
    <g opacity="0.75">
      <path d="M546 28 H558 A7 7 0 0 0 558 12 H546 A7 7 0 0 0 546 28 M546 28 L540 34 L551 28"/>
      <path d="M552 24 C546 20 547 15 552 18 C557 15 558 20 552 24 Z" fill="#9500FF" stroke="none"/>
    </g>
  </g>
</svg>

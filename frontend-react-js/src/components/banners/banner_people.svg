<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 92" width="600" height="92" preserveAspectRatio="xMaxYMid slice">
  <style>
    .dot { animation: typing 1.4s ease-in-out infinite; }
    .d2 { animation-delay: .2s } .d3 { animation-delay: .4s }
    .dash { animation: flow 2s linear infinite; }
    .arm { transform-box: fill-box; transform-origin: 0% 100%; animation: wave 3s ease-in-out infinite; }
    .heart { transform-box: fill-box; transform-origin: center; animation: beat 3s ease-in-out infinite; }
    @keyframes typing { 0%,60%,100% { opacity: .25 } 30% { opacity: 1 } }
    @keyframes flow { to { stroke-dashoffset: -14 } }
    @keyframes wave { 0%,40%,100% { transform: rotate(0) } 50% { transform: rotate(-18deg) } 60% { transform: rotate(8deg) } 70% { transform: rotate(-14deg) } 80% { transform: rotate(0) } }
    @keyframes beat { 0%,70%,100% { transform: scale(1) } 76% { transform: scale(1.3) } 82% { transform: scale(1) } 88% { transform: scale(1.2) } 94% { transform: scale(1) } }
    @media (prefers-reduced-motion: reduce) { .dot, .dash, .arm, .heart { animation: none } .dot { opacity: 1 } }
  </style>
  <defs>
    <radialGradient id="glow" cx="75%" cy="50%" r="55%">
      <stop offset="0" stop-color="#9500FF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#9500FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" x2="1">
      <stop offset="0.35" stop-color="#9500FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#9500FF" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="92" fill="#000"/>
  <rect width="600" height="92" fill="url(#glow)"/>
  <rect y="91" width="600" height="1" fill="url(#rule)"/>

  <g fill="none" stroke="#9500FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <!-- Person 1 and Person 2 chatting: shared speech bubble (typing dots) -->
    <g transform="translate(330,50)" opacity="0.55">
      <circle cy="-12" r="7"/>
      <path d="M-14 18 A14 14 0 0 1 14 18"/>
    </g>
    <g transform="translate(382,50)" opacity="0.8">
      <circle cy="-12" r="7"/>
      <path d="M-14 18 A14 14 0 0 1 14 18"/>
    </g>
    <g opacity="0.7">
      <path d="M349 30 H364 A7 7 0 0 0 364 14 H349 A7 7 0 0 0 349 30 M352 30 L346 36 L355 30"/>
      <g fill="#9500FF" stroke="none">
        <circle class="dot" cx="350" cy="22" r="1.6"/>
        <circle class="dot d2" cx="356.5" cy="22" r="1.6"/>
        <circle class="dot d3" cx="363" cy="22" r="1.6"/>
      </g>
    </g>

    <!-- Person 2 and Person 3 connected -->
    <path class="dash" d="M393 34 Q420 18 447 34" stroke-dasharray="2 5" opacity="0.6"/>

    <!-- Person 3 waving toward Person 4 -->
    <g transform="translate(458,50)" opacity="0.9">
      <circle cy="-12" r="7"/>
      <path d="M-14 18 A14 14 0 0 1 14 18"/>
      <g class="arm">
        <path d="M10 8 L20 -4"/>
        <path d="M24 -10 L27 -13 M26 -4 L30 -5" opacity="0.6"/>
      </g>
    </g>

    <!-- Person 4 replying with a heart -->
    <g transform="translate(530,50)" opacity="0.65">
      <circle cy="-12" r="7"/>
      <path d="M-14 18 A14 14 0 0 1 14 18"/>
    </g>
    <g opacity="0.75">
      <path d="M546 28 H558 A7 7 0 0 0 558 12 H546 A7 7 0 0 0 546 28 M546 28 L540 34 L551 28"/>
      <path class="heart" d="M552 24 C546 20 547 15 552 18 C557 15 558 20 552 24 Z" fill="#9500FF" stroke="none"/>
    </g>
  </g>
</svg>
